<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Emotion Detector</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
        textarea { width: 100%; height: 90px; }
        button { margin-top: 10px; padding: 8px 18px; }
        #system_response { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Emotion Detector</h1>
    <p>Enter a statement and the application will identify its emotions.</p>
    <textarea id="textToAnalyze" placeholder="Type your statement here"></textarea>
    <br>
    <button type="button" onclick="RunSentimentAnalysis()">Run Emotion Detection</button>
    <div id="system_response"></div>
    <script src="{{ url_for('static', filename='mywebscript.js') }}"></script>
</body>
</html>
